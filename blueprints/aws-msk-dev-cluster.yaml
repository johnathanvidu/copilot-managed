spec_version: 2
description: "Creates a private AWS MSK dev cluster in a new AWS account, including its VPC, private subnets, security group, and Kafka cluster."
metadata:
  display-name: "AWS MSK Dev Cluster"
  self-service: false
inputs:
  agent:
    type: agent
    description: "Agent used for deployment"
  name_prefix:
    type: 'string'
    default: 'msk-dev'
    description: 'Prefix used for AWS resource names'
  aws_region:
    type: 'string'
    default: 'us-east-1'
    description: 'AWS region for the VPC and MSK cluster'
  vpc_cidr:
    type: 'string'
    default: '10.20.0.0/16'
    description: 'CIDR block for the VPC'
  availability_zones:
    type: 'string'
    default: '["us-east-1a","us-east-1b"]'
    description: 'JSON list of two availability zones for the dev cluster'
  private_subnets:
    type: 'string'
    default: '["10.20.1.0/24","10.20.2.0/24"]'
    description: 'JSON list of private subnet CIDRs for the MSK brokers'
  broker_instance_type:
    type: 'string'
    default: 'kafka.m5.large'
    description: 'Broker instance type for the dev cluster'
  kafka_version:
    type: 'string'
    default: '3.6.0'
    description: 'Kafka version for the cluster'
  broker_storage_info:
    type: 'string'
    default: '{"ebs_storage_info":{"volume_size":100}}'
    description: 'JSON object for broker storage configuration'
  allowed_client_ingress_rules:
    type: 'string'
    default: '{"kafka_tls_iam":{"description":"Kafka TLS IAM from approved private CIDR","cidr_ipv4":"10.20.0.0/16","from_port":9098,"to_port":9098,"ip_protocol":"tcp"}}'
    description: 'JSON map of ingress rules that can reach the private Kafka brokers'
  tags:
    type: 'string'
    default: '{"Blueprint":"aws-msk-dev-cluster","Environment":"dev"}'
    description: 'JSON map of tags applied to created AWS resources'
outputs:
  connection_string:
    quick: false
    value: '{{ .grains.msk.outputs.bootstrap_brokers_sasl_iam }}'
  instance_type:
    quick: false
    value: '{{ .inputs.broker_instance_type }}'
  cluster_arn:
    quick: false
    value: '{{ .grains.msk.outputs.arn }}'
  vpc_id:
    quick: false
    value: '{{ .grains.vpc.outputs.vpc_id }}'
  private_subnet_ids:
    quick: false
    value: '{{ .grains.vpc.outputs.private_subnets }}'
  security_group_id:
    quick: false
    value: '{{ .grains.kafka_sg.outputs.id }}'
  transport_data:
    quick: false
    value: 'bootstrap={{ .grains.msk.outputs.bootstrap_brokers_sasl_iam }} | vpc_id={{ .grains.vpc.outputs.vpc_id }} | private_subnets={{ .grains.vpc.outputs.private_subnets }} | security_group_id={{ .grains.kafka_sg.outputs.id }} | port=9098 | auth=SASL_IAM | encryption=TLS | public_access=disabled'
grains:
  vpc:
    kind: terraform
    spec:
      source:
        path: 'https://github.com/terraform-aws-modules/terraform-aws-vpc.git//.'
        tag: 'v6.6.1'
      agent:
        name: '{{ .inputs.agent }}'
      inputs:
        - name: '{{ .inputs.name_prefix }}'
        - region: '{{ .inputs.aws_region }}'
        - cidr: '{{ .inputs.vpc_cidr }}'
        - azs: '{{ .inputs.availability_zones }}'
        - private_subnets: '{{ .inputs.private_subnets }}'
        - public_subnets: '[]'
        - enable_nat_gateway: false
        - single_nat_gateway: false
        - one_nat_gateway_per_az: false
        - create_igw: false
        - map_public_ip_on_launch: false
        - enable_dns_hostnames: true
        - enable_dns_support: true
        - tags: '{{ .inputs.tags }}'
      outputs:
        - vpc_id
        - private_subnets
        - vpc_cidr_block
  kafka_sg:
    kind: terraform
    depends-on: vpc
    spec:
      source:
        path: 'https://github.com/terraform-aws-modules/terraform-aws-security-group.git//.'
        tag: 'v6.0.0'
      agent:
        name: '{{ .inputs.agent }}'
      inputs:
        - name: '{{ .inputs.name_prefix }}-brokers'
        - description: 'Private access for MSK brokers'
        - region: '{{ .inputs.aws_region }}'
        - vpc_id: '{{ .grains.vpc.outputs.vpc_id }}'
        - ingress_rules: '{{ .inputs.allowed_client_ingress_rules }}'
        - egress_rules: '{"all":{"description":"Allow all outbound","cidr_ipv4":"0.0.0.0/0","from_port":0,"to_port":0,"ip_protocol":"-1"}}'
        - tags: '{{ .inputs.tags }}'
      outputs:
        - id
        - arn
        - name
  msk:
    kind: terraform
    depends-on: 'vpc,kafka_sg'
    spec:
      source:
        path: 'https://github.com/terraform-aws-modules/terraform-aws-msk-kafka-cluster.git//.'
        tag: 'v3.3.0'
      agent:
        name: '{{ .inputs.agent }}'
      inputs:
        - name: '{{ .inputs.name_prefix }}'
        - region: '{{ .inputs.aws_region }}'
        - kafka_version: '{{ .inputs.kafka_version }}'
        - number_of_broker_nodes: 2
        - broker_node_instance_type: '{{ .inputs.broker_instance_type }}'
        - broker_node_client_subnets: '{{ .grains.vpc.outputs.private_subnets }}'
        - broker_node_security_groups: '["{{ .grains.kafka_sg.outputs.id }}"]'
        - broker_node_storage_info: '{{ .inputs.broker_storage_info }}'
        - create_schema_registry: false
        - create_configuration: false
        - create_cloudwatch_log_group: false
        - cloudwatch_logs_enabled: false
        - s3_logs_enabled: false
        - firehose_logs_enabled: false
        - enhanced_monitoring: 'DEFAULT'
        - enable_storage_autoscaling: false
        - broker_node_connectivity_info: '{"public_access":{"type":"DISABLED"},"vpc_connectivity":{"client_authentication":{"sasl":{"iam":true}}},"network_type":"IPV4"}'
        - client_authentication: '{"sasl":{"iam":true}}'
        - encryption_in_transit_client_broker: 'TLS'
        - encryption_in_transit_in_cluster: true
        - tags: '{{ .inputs.tags }}'
      outputs:
        - arn
        - bootstrap_brokers_sasl_iam
        - bootstrap_brokers_vpc_connectivity_sasl_iam
        - cluster_name