spec_version: 2
description: "Creates a private, minimal-footprint AWS MSK dev cluster and all required networking in an empty AWS account"
metadata:
  display-name: "AWS Dev MSK Cluster"
inputs:
  agent:
    type: agent
    description: "Agent used for deployment"
  name_prefix:
    type: 'string'
    default: 'dev-msk'
    description: 'Prefix used to name the AWS resources'
  aws_region:
    type: 'string'
    default: 'us-east-1'
    description: 'AWS region for the VPC and MSK cluster'
  kafka_version:
    type: 'string'
    default: '3.6.0'
    description: 'Apache Kafka version for the MSK cluster'
  broker_instance_type:
    type: 'string'
    default: 'kafka.t3.small'
    description: 'Broker instance type for the dev cluster'
  number_of_broker_nodes:
    type: 'string'
    default: '2'
    description: 'Number of broker nodes to create for the dev cluster'
  broker_volume_size:
    type: 'string'
    default: '10'
    description: 'EBS volume size in GiB per broker'
  vpc_cidr:
    type: 'string'
    default: '10.20.0.0/16'
    description: 'CIDR block for the VPC'
  private_subnet_1_cidr:
    type: 'string'
    default: '10.20.1.0/24'
    description: 'CIDR for the first private subnet'
  private_subnet_2_cidr:
    type: 'string'
    default: '10.20.2.0/24'
    description: 'CIDR for the second private subnet'
outputs:
  connection_string:
    quick: false
    value: '{{ .grains.msk.outputs.connection_string }}'
  instance_type:
    quick: false
    value: '{{ .grains.msk.outputs.instance_type }}'
  cluster_arn:
    quick: false
    value: '{{ .grains.msk.outputs.cluster_arn }}'
  transport_data:
    quick: false
    value: '{{ .grains.msk.outputs.transport_data }}'
grains:
  msk:
    kind: terraform
    spec:
      source:
        store: copilot-managed
        path: terraform/aws-dev-msk
      agent:
        name: '{{ .inputs.agent }}'
      inputs:
        - name_prefix: '{{ .inputs.name_prefix }}'
        - aws_region: '{{ .inputs.aws_region }}'
        - kafka_version: '{{ .inputs.kafka_version }}'
        - broker_instance_type: '{{ .inputs.broker_instance_type }}'
        - number_of_broker_nodes: '{{ .inputs.number_of_broker_nodes }}'
        - broker_volume_size: '{{ .inputs.broker_volume_size }}'
        - vpc_cidr: '{{ .inputs.vpc_cidr }}'
        - private_subnet_1_cidr: '{{ .inputs.private_subnet_1_cidr }}'
        - private_subnet_2_cidr: '{{ .inputs.private_subnet_2_cidr }}'
      outputs:
        - connection_string
        - instance_type
        - cluster_arn
        - transport_data
